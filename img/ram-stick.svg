<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64">
  <defs>
    <linearGradient id="ramBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#161a3b"/>
    </linearGradient>
    <linearGradient id="ramRgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <!-- 상단 RGB 라이트 디퓨저 -->
  <rect x="12" y="6" width="236" height="5" rx="2.5" fill="url(#ramRgb)"/>
  <!-- 방열판 본체 -->
  <rect x="8" y="11" width="244" height="37" rx="4" fill="url(#ramBody)" stroke="#818cf8" stroke-width="1.8"/>
  <!-- 메모리 모듈 칩 방열 라인 -->
  <rect x="22" y="17" width="32" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <rect x="62" y="17" width="32" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <rect x="166" y="17" width="32" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <rect x="206" y="17" width="32" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="130" y="33" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#facc15" text-anchor="middle" letter-spacing="1.5">DDR MEMORY</text>
  <!-- 하단 금도금 핀 & 노치 -->
  <rect x="20" y="48" width="102" height="7" rx="1" fill="#facc15" stroke="#b45309" stroke-width="1"/>
  <rect x="134" y="48" width="106" height="7" rx="1" fill="#facc15" stroke="#b45309" stroke-width="1"/>
</svg>
