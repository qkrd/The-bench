<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160">
  <defs>
    <linearGradient id="gearAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e040fb"/>
    </linearGradient>
  </defs>

  <!-- 좌측 기어(톱니바퀴) + 스패너 로고 (방패 제거) -->
  <g transform="translate(80, 78) scale(1.3)">
    <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round">
      <path d="M-6,-34 H6 L8,-26 A26,26 0 0 1 15,-23 L22,-27 L30,-19 L26,-12 A26,26 0 0 1 29,-5 L37,-3 V9 L29,11 A26,26 0 0 1 26,18 L30,25 L22,33 L15,29 A26,26 0 0 1 8,32 L6,40 H-6 L-8,32 A26,26 0 0 1 -15,29 L-22,33 L-30,25 L-26,18 A26,26 0 0 1 -29,11 L-37,9 V-3 L-29,-5 A26,26 0 0 1 -26,-12 L-30,-19 L-22,-27 L-15,-23 A26,26 0 0 1 -8,-26 Z"
            fill="#0b0918"/>
    </g>
    <circle cx="0" cy="3" r="13" fill="#131026" stroke="#ffffff" stroke-width="2.2"/>

    <!-- 대각선 스패너(렌치) -->
    <g transform="rotate(-45)">
      <rect x="-4.5" y="-26" width="9" height="52" rx="3" fill="#131026" stroke="url(#gearAccent)" stroke-width="2.6"/>
      <path d="M-10,-32 A11,11 0 1 0 10,-32 L5,-26 H-5 Z" fill="#131026" stroke="url(#gearAccent)" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="0" cy="28" r="7" fill="#131026" stroke="url(#gearAccent)" stroke-width="2.6"/>
    </g>
  </g>

  <!-- 우측 한 줄 메인 타이틀: The bench -->
  <text x="162" y="102"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="72" font-weight="900" letter-spacing="2"
        fill="#131026" stroke="#ffffff" stroke-width="3.5" paint-order="stroke fill">The bench</text>
</svg>
