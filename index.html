<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The bench — 2026-11 게이밍 하드웨어 벤치마크 및 시스템 모니터">
    <title>The bench · Hardware Monitor</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="landing-shell">
      <!-- 최소화된 우측 상단 유틸리티 바 -->
      <header class="minimal-corner-bar">
        <span id="db-status-badge" class="status-pill fallback">로컬 폴백(Supabase 미연결)</span>
        <button type="button" class="pill-btn small" id="theme-toggle-btn">라이트 모드</button>
        <button type="button" class="icon-btn" id="open-db-config-btn" aria-label="Supabase DB 설정" title="Supabase DB 설정">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </header>

      <main>
        <!-- R2 스타일 히어로: 아웃라인 엠블럼/워드마크 + 글래스 필 버튼 행 -->
        <section class="hero-stage" aria-label="메인 히어로">
          <div class="hero-logo-wrap">
            <img
              src="img/logo.svg"
              alt="The bench 로고"
              class="hero-logo"
              width="620"
              height="160">
          </div>

          <nav class="hero-pill-row" aria-label="주요 기능 이동">
            <button type="button" class="pill-btn" id="open-login-btn">
              <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                <polyline points="10 17 15 12 10 7"></polyline>
                <line x1="15" y1="12" x2="3" y2="12"></line>
              </svg>
              <span>로그인</span>
            </button>

            <button type="button" class="pill-btn" id="open-signin-btn">
              <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
              </svg>
              <span>회원가입</span>
            </button>

            <a href="pages/spec-setup.html?id=admin&amp;name=admin" class="pill-btn">
              <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                <rect x="9" y="9" width="6" height="6"></rect>
                <line x1="9" y1="1" x2="9" y2="4"></line>
                <line x1="15" y1="1" x2="15" y2="4"></line>
                <line x1="9" y1="20" x2="9" y2="23"></line>
                <line x1="15" y1="20" x2="15" y2="23"></line>
              </svg>
              <span>바로 체험하기</span>
            </a>
          </nav>

          <p class="hero-subline">공용 체험 계정 (admin / admin)으로 로그인하여 내 PC 사양 분석과 실시간 점유율을 확인하세요.</p>
        </section>
      </main>

      <footer class="page-footer">
        <span>The bench · 2026-11 Gaming Benchmark &amp; Real-time Monitor</span>
        <a href="https://supabase.com/docs" target="_blank" rel="noopener noreferrer">Supabase 연동 가이드</a>
      </footer>

      <!-- 로그인 모달 (admin / admin 지원) -->
      <div class="modal-overlay" id="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
        <div class="modal-card">
          <h2 id="login-title">로그인</h2>
          <p class="admin-hint">공용 계정: <strong>admin</strong> / <strong>admin</strong></p>

          <form action="pages/spec-setup.html" method="get" id="login-form">
            <div class="form-row">
              <label for="login-id">Id</label>
              <input
                type="text"
                id="login-id"
                name="id"
                value="admin"
                placeholder="아이디 입력"
                required>
            </div>

            <div class="form-row">
              <label for="login-pw">Pw</label>
              <input
                type="password"
                id="login-pw"
                name="pw"
                value="admin"
                placeholder="비밀번호 입력"
                autocomplete="current-password"
                required>
            </div>

            <p class="form-feedback" id="login-feedback"></p>

            <div class="modal-actions">
              <button type="submit" class="box-btn primary">로그인</button>
              <button type="button" class="box-btn" id="go-signin-btn">회원가입</button>
              <button type="button" class="box-btn" id="close-login-btn">닫기</button>
            </div>
          </form>
        </div>
      </div>

      <!-- 회원가입 모달 -->
      <div class="modal-overlay" id="signin-modal" role="dialog" aria-modal="true" aria-labelledby="signin-title">
        <div class="modal-card">
          <h2 id="signin-title">회원가입</h2>
          <form id="signin-form">
            <div class="form-row">
              <label for="sign-name">Name</label>
              <input type="text" id="sign-name" name="name" placeholder="사용자 이름" required>
            </div>

            <div class="form-row">
              <label for="sign-id">Id</label>
              <input type="text" id="sign-id" name="id" placeholder="사용할 아이디" required>
            </div>

            <div class="form-row">
              <label for="sign-email">E-mail</label>
              <input type="email" id="sign-email" name="email" placeholder="user@example.com" required>
            </div>

            <div class="form-row">
              <label for="sign-pw">Pw</label>
              <input type="password" id="sign-pw" name="pw" placeholder="비밀번호" autocomplete="new-password" required>
            </div>

            <div class="form-row">
              <label for="sign-repw">Re-Pw</label>
              <input type="password" id="sign-repw" name="repw" placeholder="비밀번호 확인" autocomplete="new-password" required>
            </div>

            <p class="form-feedback" id="signin-feedback"></p>

            <div class="modal-actions">
              <button type="submit" class="box-btn primary">회원가입 완료</button>
              <button type="button" class="box-btn" id="back-to-login-btn">로그인으로</button>
              <button type="button" class="box-btn" id="close-signin-btn">닫기</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Supabase 설정 모달 -->
      <div class="modal-overlay" id="db-config-modal" role="dialog" aria-modal="true" aria-labelledby="db-config-title">
        <div class="modal-card">
          <h2 id="db-config-title">Supabase Cloud 설정</h2>
          <p class="admin-hint">
            Project URL과 Anon Key를 입력하면 클라우드 DB에 연동합니다. 비워두면 로컬 폴백으로 동작합니다.
            <a href="https://supabase.com/dashboard" target="_blank" rel="noopener noreferrer">Supabase 대시보드</a>
          </p>

          <form id="db-config-form">
            <div class="form-row">
              <label for="db-url-input">Project URL</label>
              <input type="url" id="db-url-input" name="url" placeholder="https://xxxx.supabase.co">
            </div>

            <div class="form-row">
              <label for="db-anon-input">Anon Key</label>
              <input type="text" id="db-anon-input" name="anonKey" placeholder="eyJhbGciOi...">
            </div>

            <p class="form-feedback" id="db-config-feedback"></p>

            <div class="modal-actions">
              <button type="submit" class="box-btn primary" id="save-db-config-btn">저장</button>
              <button type="button" class="box-btn" id="clear-db-config-btn">초기화</button>
              <button type="button" class="box-btn" id="close-db-config-btn">닫기</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- 클래식 브라우저 스크립트 -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script>
      (function () {
        const loginModal = document.getElementById("login-modal");
        const signinModal = document.getElementById("signin-modal");
        const dbConfigModal = document.getElementById("db-config-modal");

        const openLoginBtn = document.getElementById("open-login-btn");
        const openSigninBtn = document.getElementById("open-signin-btn");
        const closeLoginBtn = document.getElementById("close-login-btn");
        const goSigninBtn = document.getElementById("go-signin-btn");
        const backToLoginBtn = document.getElementById("back-to-login-btn");
        const closeSigninBtn = document.getElementById("close-signin-btn");

        const openDbConfigBtn = document.getElementById("open-db-config-btn");
        const closeDbConfigBtn = document.getElementById("close-db-config-btn");
        const clearDbConfigBtn = document.getElementById("clear-db-config-btn");
        const dbConfigForm = document.getElementById("db-config-form");
        const dbStatusBadge = document.getElementById("db-status-badge");
        const themeToggleBtn = document.getElementById("theme-toggle-btn");

        const signinForm = document.getElementById("signin-form");
        const loginForm = document.getElementById("login-form");

        // 테마 토글 (.라이트테마)
        function applyTheme(theme) {
          const isLight = theme === "light";
          document.body.classList.toggle("라이트테마", isLight);
          themeToggleBtn.textContent = isLight ? "다크 모드" : "라이트 모드";
        }
        applyTheme(localStorage.getItem("hw_theme") || "dark");

        themeToggleBtn.addEventListener("click", () => {
          const next = document.body.classList.contains("라이트테마") ? "dark" : "light";
          localStorage.setItem("hw_theme", next);
          applyTheme(next);
        });

        // DB 상태 표시
        function refreshDbStatus() {
          if (!window.AppDB) return;
          const configured = window.AppDB.isConfigured();
          dbStatusBadge.textContent = window.AppDB.getModeLabel();
          dbStatusBadge.classList.toggle("cloud", configured);
          dbStatusBadge.classList.toggle("fallback", !configured);
        }

        function openLoginModal() {
          signinModal.classList.remove("active");
          dbConfigModal.classList.remove("active");
          loginModal.classList.add("active");
          document.getElementById("login-feedback").textContent = "";
          document.getElementById("login-id").focus();
        }

        function openSigninModal() {
          loginModal.classList.remove("active");
          dbConfigModal.classList.remove("active");
          signinModal.classList.add("active");
          document.getElementById("signin-feedback").textContent = "";
          document.getElementById("sign-name").focus();
        }

        openLoginBtn.addEventListener("click", openLoginModal);
        openSigninBtn.addEventListener("click", openSigninModal);
        goSigninBtn.addEventListener("click", openSigninModal);
        backToLoginBtn.addEventListener("click", openLoginModal);

        closeLoginBtn.addEventListener("click", () => loginModal.classList.remove("active"));
        closeSigninBtn.addEventListener("click", () => signinModal.classList.remove("active"));

        openDbConfigBtn.addEventListener("click", () => {
          loginModal.classList.remove("active");
          signinModal.classList.remove("active");
          const cfg = window.AppDB ? window.AppDB.getConfig() : { url: "", anonKey: "" };
          document.getElementById("db-url-input").value = cfg.url || "";
          document.getElementById("db-anon-input").value = cfg.anonKey || "";
          document.getElementById("db-config-feedback").textContent = "";
          dbConfigModal.classList.add("active");
          document.getElementById("db-url-input").focus();
        });

        closeDbConfigBtn.addEventListener("click", () => dbConfigModal.classList.remove("active"));

        clearDbConfigBtn.addEventListener("click", () => {
          if (window.AppDB) window.AppDB.saveConfig("", "");
          document.getElementById("db-url-input").value = "";
          document.getElementById("db-anon-input").value = "";
          const fb = document.getElementById("db-config-feedback");
          fb.className = "form-feedback success";
          fb.textContent = "초기화 완료: 로컬 폴백 모드로 동작합니다.";
          refreshDbStatus();
        });

        dbConfigForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const url = document.getElementById("db-url-input").value.trim();
          const anonKey = document.getElementById("db-anon-input").value.trim();
          if (window.AppDB) window.AppDB.saveConfig(url, anonKey);
          refreshDbStatus();
          const fb = document.getElementById("db-config-feedback");
          fb.className = "form-feedback success";
          fb.textContent = window.AppDB && window.AppDB.isConfigured()
            ? "Supabase Cloud 설정이 저장되었습니다."
            : "로컬 폴백 설정으로 저장되었습니다.";
        });

        signinForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const name = document.getElementById("sign-name").value.trim();
          const id = document.getElementById("sign-id").value.trim();
          const email = document.getElementById("sign-email").value.trim();
          const pw = document.getElementById("sign-pw").value;
          const repw = document.getElementById("sign-repw").value;
          const feedback = document.getElementById("signin-feedback");
          feedback.className = "form-feedback";

          if (pw !== repw) {
            feedback.textContent = "Pw와 Re-Pw가 일치하지 않습니다.";
            document.getElementById("sign-repw").focus();
            return;
          }

          const res = await window.AppDB.signUp({ name, id, email, password: pw });
          if (!res.ok) {
            feedback.textContent = res.error || "회원가입에 실패했습니다.";
            return;
          }

          signinModal.classList.remove("active");
          loginModal.classList.add("active");
          document.getElementById("login-id").value = id;
          document.getElementById("login-pw").value = pw;
          const loginFeedback = document.getElementById("login-feedback");
          loginFeedback.className = "form-feedback success";
          loginFeedback.textContent = "가입 완료(" + (res.mode || "완료") + "). 로그인 버튼을 눌러 이동하세요.";
        });

        loginForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const id = document.getElementById("login-id").value.trim();
          const pw = document.getElementById("login-pw").value;
          const feedback = document.getElementById("login-feedback");
          feedback.className = "form-feedback";
          feedback.textContent = "인증 중...";

          const res = await window.AppDB.login({ id, password: pw });
          if (res.ok && res.user) {
            const userName = res.user.name || res.user.id || id;
            window.location.href =
              "pages/spec-setup.html?id=" +
              encodeURIComponent(res.user.id || id) +
              "&name=" +
              encodeURIComponent(userName);
            return;
          }

          feedback.textContent = res.error || "아이디 또는 비밀번호가 올바르지 않습니다. (admin / admin)";
        });

        refreshDbStatus();
      })();
    </script>
  </body>
</html>
